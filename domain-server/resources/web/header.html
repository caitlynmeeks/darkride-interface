<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Darkride world server</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      // the light or dark look, before anything is drawn: the choice from the top bar, or (Auto) the computer's own
      (function() {
        var mode = null;
        try {
          mode = localStorage.getItem("darkride.theme");
        } catch (e) {
        }
        var light = mode === "light" ||
          (mode !== "dark" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
      })();
    </script>

    <link href="/css/bootstrap.min.css" rel="stylesheet" media="screen">
    <link href="/css/style.css" rel="stylesheet" media="screen">
    <link href="/css/sweetalert.css" rel="stylesheet" media="screen">
    <link href="/css/bootstrap-switch.min.css" rel="stylesheet" media="screen">
    <link href="/css/bootstrap-sortable.css" rel="stylesheet" media="screen">
    <link href="/css/darkride.css" rel="stylesheet" media="screen">
    <link rel="icon" type="image/x-icon" href="/favicon.png">

    <script src='/js/sweetalert.min.js'></script>
  </head>
  <body class="dr-app">
    <!-- The top bar: what this is, and the actions for the whole server -->
    <header class="dr-topbar">
      <button type="button" class="dr-menu-toggle" id="dr-menu-toggle" aria-label="Show the menu">
        <span class="glyphicon glyphicon-menu-hamburger"></span>
        <span id="hamburger-badge" class="badge"></span>
      </button>
      <a class="dr-brand" href="/">
        <img src="/favicon.png" alt="" />
        <span class="dr-brand-text">Darkride <span class="dr-brand-sub">World server</span></span>
      </a>
      <div class="dr-topbar-actions">
        <button type="button" class="btn btn-default dr-theme-toggle" id="dr-theme-toggle" title="Light or dark look">
          <span class="glyphicon glyphicon-adjust"></span><span class="hidden-xs dr-theme-toggle-text"> Auto</span>
        </button>
        <a id="visit-domain-link" class="btn btn-default" role="button" target="_blank" style="display: none;"
           title="Open this world in Darkride">
          <img id="visit-hmd-icon" src="/images/hmd-w-eyes.svg" alt="" />
          <span class="hidden-xs">Visit world</span>
        </a>
        <a href="#" id="restart-server" class="btn btn-default" title="Restart the world server">
          <span class="glyphicon glyphicon-refresh"></span><span class="hidden-xs"> Restart</span>
        </a>
        <button id="save-settings-button" class="save-button btn btn-success" disabled="true"
                title="Save your changes">
          <span class="glyphicon glyphicon-floppy-disk"></span> <span class="save-button-text">Save</span>
        </button>
      </div>
    </header>

    <!-- The sidebar: the pages, and on the page you're on, its sections -->
    <nav class="dr-sidebar" id="collapsed-navbar" role="navigation">
      <ul class="nav dr-nav">
        <li>
          <a href="/"><span class="glyphicon glyphicon-dashboard"></span> Overview</a>
        </li>
        <li>
          <a href="/content/"><span class="glyphicon glyphicon-globe"></span> World content
            <span class="content-settings-badge badge"></span></a>
          <ul id="content-settings-nav-dropdown" class="dr-subnav"></ul>
        </li>
        <li>
          <a href="/settings/"><span class="glyphicon glyphicon-cog"></span> Settings
            <span class="domain-settings-badge badge"></span></a>
          <ul id="domain-settings-nav-dropdown" class="dr-subnav"></ul>
        </li>
        <li>
          <a href="/assignment/"><span class="glyphicon glyphicon-console"></span> Run a script</a>
        </li>
      </ul>
      <div class="dr-sidebar-footer">
        <a href="https://vr.darkride.ai" target="_blank">vr.darkride.ai</a>
      </div>
    </nav>
    <div class="dr-sidebar-backdrop" id="dr-sidebar-backdrop"></div>

    <div class="modal fade" id="restart-modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title">The world server is restarting</h4>
          </div>
          <div class="modal-body">
            <p>Your world will be back in a moment. This page will refresh by itself in <span id="refresh-time">3 seconds</span>.</p>
          </div>
        </div><!-- /.modal-content -->
      </div><!-- /.modal-dialog -->
    </div><!-- /.modal -->

    <main class="dr-main">
    <div class="container-fluid">
