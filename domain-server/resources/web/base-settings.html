<div class="col-md-10 col-md-offset-1 col-xs-12">
  <div class="row">

    <div class="col-xs-12">
      <div id="cloud-domains-alert" class="alert alert-info alert-dismissible" role="alert" style="display: none;">
        <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
        <span class="alert-link">
          <a href="https://vr.darkride.ai" target="_blank" class="blue-link">Visit vr.darkride.ai</a> to manage your worlds
        </span>
      </div>

      <h1 class="dr-page-title" id="dr-page-title"></h1>
      <p class="dr-page-intro" id="dr-page-intro"></p>

      <form id="settings-form" role="form">
        <script id="panels-template" type="text/template">
          <% _.each(descriptions, function(group){ %>
            <% if (!group.hidden) { %>

              <% var settings = _.partition(group.settings, function(value, index) { %>
                <% return !value.deprecated %>
              <% })[0] %>

              <% var split_settings = _.partition(group.settings, function(value, index) { %>
                <% return !value.advanced %>
              <% }) %>

              <% isGrouped = !!group.name %>
              <% panelID = isGrouped ? group.name : group.html_id %>

              <% var shownBasic = _.filter(split_settings[0], function(s) { return !s.deprecated && s.type !== 'hidden'; }).length %>
              <% var shownExpert = _.filter(split_settings[1], function(s) { return !s.deprecated && s.type !== 'hidden'; }).length %>
              <% var expertOnly = shownBasic == 0 && shownExpert > 0 %>

              <div id="<%- panelID %>_group" class="anchor"></div>
              <div class="panel panel-default<%- (isGrouped) ? ' grouped' : '' %><%- expertOnly ? ' dr-expert-only' : '' %>"
                   id="<%- panelID %>">
                <div class="panel-heading">
                  <h3 class="panel-title"><%- group.label %></h3>
                  <% if (expertOnly) { %><span class="dr-tag">For experts</span><% } %>
                  <span class="badge"></span>
                  <% if (group.description) { %><p class="panel-description"><%= group.description %></p><% } %>
                </div>
                <div class="panel-body">
                  <% _.each(split_settings[0], function(setting) { %>
                    <% keypath = isGrouped ? group.name + "." + setting.name : setting.name %>
                    <%= getFormGroup(keypath, setting, values, false) %>
                  <% }); %>

                  <% if (shownExpert > 0) { %>
                    <% if (expertOnly) { %>
                      <p class="dr-expert-note">These settings are for fine-tuning. The defaults suit most worlds, so you can leave them alone.</p>
                    <% } %>
                    <button type="button" class="btn btn-default" data-toggle="collapse" data-target="#<%- panelID %>-advanced">
                      <%- expertOnly ? 'Show these settings' : 'More settings' %> (<%- shownExpert %>) <span class="caret"></span></button>
                    <div id="<%- panelID %>-advanced" class="collapse advanced-settings-section">
                      <% _.each(split_settings[1], function(setting) { %>
                        <% keypath = isGrouped ? group.name + "." + setting.name : setting.name %>
                        <%= getFormGroup(keypath, setting, values, true) %>
                      <% }); %>
                    </div>
                  <% } %>
                </div>
              </div>
            <% } %>
          <% }); %>
        </script>
        <div id="panels"></div>
      </form>
    </div>
  </div>
</div>
