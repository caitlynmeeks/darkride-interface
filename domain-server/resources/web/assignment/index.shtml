<h1 class="dr-page-title">Run a script</h1>
<p class="dr-page-intro">
  Write or paste a script, then press Run: the server runs it on its own, like a visitor nobody controls. It stops
  when the server restarts. To keep a script running, add it under
  <a href="/content/#scripts">Always-running scripts</a> on the World content page.
</p>

<div class="panel panel-default dr-run-panel">
  <div class="panel-heading dr-run-toolbar">
    <div id="extra-fields">
      <label class='big-field' id='instance-field'>
        <span>Copies</span>
        <input type='number' min='1' name='instances' placeholder='1' class="form-control">
      </label>
      <label class='big-field' id='pool-field' title="Leave empty unless you run script runners in named groups">
        <span>Runner group</span>
        <input type='text' name='pool' placeholder='Any' class="form-control">
      </label>
    </div>
    <span class="dr-run-status" id="run-message" role="status"></span>
    <button type="button" class='btn btn-success' id='deploy-button'>
      <span class="glyphicon glyphicon-play"></span> Run
    </button>
  </div>
  <div class="dr-run-editor">
    <pre id='editor'><!--#include file="placeholder.js"--></pre>
  </div>
</div>
